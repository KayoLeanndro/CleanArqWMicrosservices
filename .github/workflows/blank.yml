name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Testar e validar imagem Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: atualizar codigo
        uses: actions/checkout@v4

      - name: Configurar Java e Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Executar testes e cobertura
        env:
          SPRING_PROFILES_ACTIVE: test
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode verify

      - name: Construir imagem Docker
        run: docker build --tag mechanics-api:${{ github.sha }} .
